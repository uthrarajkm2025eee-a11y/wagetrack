spring.application.name=wagetrack-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:wagetrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

wagetrack.standard-workday-hours=8.0
wagetrack.overtime-multiplier=1.5
wagetrack.seed-data=false
