spring.application.name=wagetrack-backend
server.port=8081

# Production MySQL 8.0 Connection Properties
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wagetrack}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable spring SQL script runner so Hibernate DDL auto handles schema generation
spring.sql.init.mode=never

# JPA & Hibernate Settings for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# WageTrack Business Configurations
wagetrack.standard-workday-hours=8.0
wagetrack.overtime-multiplier=1.5
wagetrack.seed-data=false

# Swagger OpenAPI Documentation Path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
