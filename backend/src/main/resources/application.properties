spring.application.name=wagetrack-backend
server.port=8081

# Default In-Memory Database (MySQL Compatible Mode) for Instant Execution
spring.datasource.url=jdbc:h2:mem:wagetrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Disable spring SQL script runner so Hibernate DDL auto handles schema generation
spring.sql.init.mode=never

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# WageTrack Business Configurations
wagetrack.standard-workday-hours=8.0
wagetrack.overtime-multiplier=1.5
wagetrack.seed-data=true

# Swagger OpenAPI Documentation Path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
